<link rel="icon" href="data:," />
<script>
  // 提前应用主题，避免 FOUC；详细逻辑在 js/theme.js
  (function () {
    try {
      var stored = localStorage.getItem('furnace.theme');
      var theme = stored ? JSON.parse(stored) : null;
      if (theme !== 'dark' && theme !== 'light') {
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

        <form id="setup-form" class="hidden space-y-4" autocomplete="off" onsubmit="return false">

            </div>
            <div>
              <label class="text-xs text-gray-400 mb-1.5 block" for="setupUsername">登录账号</label>
              <input class="input" id="setupUsername" autocomplete="username" maxlength="32" value="admin" required />
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

              <label class="text-xs text-gray-400 mb-1.5 block" for="setupPassword">登录密码</label>
              <input class="input" type="password" id="setupPassword" autocomplete="new-password" minlength="8" maxlength="128" placeholder="至少 8 位" required />

<!-- UNIFIED CONTENT WORKSPACE: shares navigation, account and backend with the original system. -->
<template id="tpl-workbench">
  <section class="creator-workspace" id="workbench-root">
    <div id="workspace-loading" class="workspace-feedback" role="status">正在加载内容创作…</div>
    <div id="workspace-error" class="workspace-feedback" role="alert" hidden><span id="workspace-error-text"></span><button class="pui-btn" data-action="retry">重试</button></div>
    <section class="project-shelf" aria-label="我的内容">
      <div class="project-tools"><strong>我的内容</strong><button class="pui-btn pui-btn-primary" data-action="new">新建内容</button><button class="pui-btn" data-action="vault-config">连接知识库</button><button class="pui-btn" data-action="runtime">检查能力</button><span class="pui-tag" id="runtime">检查运行环境</span></div>
      <nav id="project-list" class="pui-nav" aria-label="内容稿件"></nav>
    </section>
    <div class="workspace-body">
      <section class="pui-content">
        <div class="overview">
          <div><p class="eyebrow">点灯的曾曾 / 创作实验</p><h1>内容创作</h1><p class="muted">公众号 · 小红书 · 抖音 / 图文与录屏讲解</p></div>
          <div class="goal"><span class="muted">粉丝总量</span><strong id="fans-value">未更新</strong><button class="plain-button" data-action="fans">更新数据</button><small>起点 50 · 目标 20,050（不保证）</small></div>
        </div>
        <section class="weekly-strip" aria-label="每周节奏"><div><strong>18 h</strong><span>基础投入 / 另留 0～4 h 缓冲</span></div><p>2 个选题 → 2 组图文 ＋ 1 条录屏 → 1 篇公众号 → 登记与复盘</p></section>
        <section id="empty" class="empty-state" hidden><span class="empty-icon">✳</span><h2>从一次真实的 AI 实测开始</h2><p>写下你想帮谁解决什么问题，再补上截图、步骤和实际结果。</p><button class="pui-btn pui-btn-primary" data-action="new">新建内容</button><p class="muted">也可以先载入示例，检查排版与导出流程。</p><button class="pui-btn" data-action="example">载入示例</button></section>
        <section id="editor" hidden>
          <div id="capability-callout" class="capability-callout" hidden></div>
          <div class="editor-head"><div><span class="eyebrow">CURRENT PROJECT</span><h2 id="project-heading"></h2><span id="save-status" class="muted" role="status">已保存</span></div><div class="actions"><button class="pui-btn" id="recovery-export" data-action="export-recovery" hidden>导出副本</button><button class="pui-btn pui-btn-primary" data-action="save">保存草稿</button></div></div>
          <nav class="work-tabs" aria-label="创作步骤" role="tablist">
            <button id="creator-tab-knowledge" role="tab" aria-selected="false" aria-controls="creator-panel-knowledge" tabindex="-1" data-tab="knowledge">知识库</button>
            <button id="creator-tab-materials" role="tab" aria-selected="true" aria-controls="creator-panel-materials" tabindex="0" data-tab="materials">01 选题母稿</button><button id="creator-tab-wechat" role="tab" aria-selected="false" aria-controls="creator-panel-wechat" tabindex="-1" data-tab="wechat">02 公众号</button><button id="creator-tab-xhs" role="tab" aria-selected="false" aria-controls="creator-panel-xhs" tabindex="-1" data-tab="xhs">03 小红书</button><button id="creator-tab-douyin" role="tab" aria-selected="false" aria-controls="creator-panel-douyin" tabindex="-1" data-tab="douyin">04 抖音图文</button><button id="creator-tab-video" role="tab" aria-selected="false" aria-controls="creator-panel-video" tabindex="-1" data-tab="video">05 视频制作</button><button id="creator-tab-images" role="tab" aria-selected="false" aria-controls="creator-panel-images" tabindex="-1" data-tab="images">06 图片</button><button id="creator-tab-publish" role="tab" aria-selected="false" aria-controls="creator-panel-publish" tabindex="-1" data-tab="publish">07 发布复盘</button>
          </nav>
          <section class="pui-panel workspace-panel" id="creator-panel-knowledge" role="tabpanel" aria-labelledby="creator-tab-knowledge" data-panel="knowledge" hidden>
            <div class="pui-panel-head"><h3 class="pui-panel-title">Obsidian 知识库</h3><button class="pui-btn" data-action="archive-confirm">归档到 OB</button></div>
            <div class="pui-panel-body">
              <p class="panel-note" id="vault-status">尚未连接知识库。</p>
              <p class="pui-help">仅关联选中的笔记；生成时这些文字会发给 Codex。</p>
              <form id="vault-search" class="vault-search"><label class="pui-field"><span class="pui-label">搜索笔记</span><input name="q" class="pui-control" maxlength="100" placeholder="按文件名或目录搜索"></label><button class="pui-btn" type="submit">查询</button><button class="pui-btn" type="button" data-action="vault-config">连接设置</button></form>
              <h4>本篇关联</h4><div id="vault-selected" aria-live="polite"></div>
              <h4>库内笔记</h4><p class="muted" id="vault-count"></p><div id="vault-notes"></div>
            </div>
          </section>
          <section class="pui-panel workspace-panel" id="creator-panel-materials" role="tabpanel" aria-labelledby="creator-tab-materials" data-panel="materials">
            <div class="pui-panel-head"><h3 class="pui-panel-title">选题与事实母稿</h3><div class="actions"><button class="pui-btn" data-kind="topicPlan">推荐选题</button><button class="pui-btn" data-kind="master">生成母稿</button><button class="pui-btn" data-action="import-draft">导入正文</button><button class="pui-btn" data-kind="review">检查内容</button></div></div>
            <div class="pui-panel-body pui-form-columns">
              <label class="pui-field"><span class="pui-label">内容标题</span><input class="pui-control" data-field="title" maxlength="120"></label>
              <label class="pui-field"><span class="pui-label">目标读者</span><input class="pui-control" data-field="audience" maxlength="500"></label>
