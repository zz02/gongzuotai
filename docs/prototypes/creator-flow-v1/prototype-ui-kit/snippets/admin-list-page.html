<link rel="stylesheet" href="./prototype-ui-kit/dist/prototype-ui.css">
<script defer src="./prototype-ui-kit/dist/prototype-ui.js"></script>

<section class="pui-content">
  <h1 class="pui-page-title">页面标题</h1>
  <section class="pui-panel">
    <div class="pui-panel-head"><h2 class="pui-panel-title">筛选条件</h2></div>
    <div class="pui-panel-body">
      <form class="pui-filter">
        <label class="pui-field"><span class="pui-label">对象名称</span><input class="pui-control" placeholder="请输入名称"></label>
        <label class="pui-field"><span class="pui-label">状态</span><select class="pui-control"><option>全部状态</option></select></label>
        <button class="pui-btn pui-btn-primary" type="button">查询</button>
        <button class="pui-btn" type="button">重置</button>
      </form>
    </div>
  </section>

  <section class="pui-panel">
    <div class="pui-panel-head"><h2 class="pui-panel-title">数据表格</h2><button class="pui-btn pui-btn-primary pui-btn-sm">新建</button></div>
    <div class="pui-panel-body">
      <div class="pui-table-wrap">
        <table class="pui-table">
          <thead><tr><th>对象名称</th><th>创建日期</th><th class="is-center">状态</th><th class="is-action">操作</th></tr></thead>
          <tbody><tr><td>示例对象</td><td>2026-07-01</td><td class="is-center"><span class="pui-tag pui-tag-success">正常</span></td><td class="is-action"><a class="pui-link">查看</a></td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</section>
