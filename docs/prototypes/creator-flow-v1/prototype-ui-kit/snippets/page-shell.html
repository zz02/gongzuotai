<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 原型</title>
  <script defer src="./prototype-ui-kit/dist/prototype-ui.js"></script>
</head>
<body class="pui-page">
  <div class="pui-admin">
    <aside class="pui-sidebar">
      <div class="pui-brand">项目原型</div>
      <nav class="pui-nav">
        <a class="is-active" href="#">页面一</a>
        <a href="#">页面二</a>
        <a href="#">页面三</a>
      </nav>
    </aside>

    <main class="pui-main">
      <header class="pui-topbar">
        <strong>原型系统</strong>
        <button class="pui-btn pui-btn-primary pui-btn-sm">新建</button>
      </header>

      <section class="pui-content">
        <h1 class="pui-page-title">页面标题</h1>
        <p class="pui-page-desc">这里填写页面说明。</p>

        <section class="pui-panel">
          <div class="pui-panel-head"><h2 class="pui-panel-title">筛选条件</h2></div>
          <div class="pui-panel-body">
            <form class="pui-filter">
              <label class="pui-field"><span class="pui-label">对象名称</span><input class="pui-control" placeholder="请输入名称"></label>
              <label class="pui-field"><span class="pui-label">状态</span><select class="pui-control"><option>全部状态</option><option>正常</option><option>停用</option></select></label>
              <button class="pui-btn pui-btn-primary" type="button">查询</button>
              <button class="pui-btn" type="button">重置</button>
            </form>
          </div>
        </section>

        <section class="pui-panel">
          <div class="pui-panel-head"><h2 class="pui-panel-title">数据表格</h2><button class="pui-btn pui-btn-primary pui-btn-sm">新建</button></div>
          <div class="pui-panel-body">
            <div class="pui-table-wrap">
              <table class="pui-table">
                <thead><tr><th>对象名称</th><th>创建日期</th><th class="is-center">状态</th><th class="is-action">操作</th></tr></thead>
                <tbody><tr><td>示例对象</td><td>2026-07-09</td><td class="is-center"><span class="pui-tag pui-tag-success">正常</span></td><td class="is-action"><a class="pui-link">查看</a></td></tr></tbody>
              </table>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
